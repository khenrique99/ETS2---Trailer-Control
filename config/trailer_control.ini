; ============================================================
;  ETS2 Trailer Control - configuracao
;  Fica em <ETS2>\bin\win_x64\plugins\trailer_control.ini
;  O plugin vigia este arquivo: qualquer mudanca (a mao ou pela tela do Trailer Control)
;  vale em ate 1 segundo, sem reiniciar o jogo.
; ============================================================

[geral]
; So permite engatar/desengatar com o caminhao (quase) parado
exigir_parado = 1
velocidade_max_kmh = 3

[atalhos]
; Unico atalho: abre a tela do Trailer Control (TrailerControl.exe na mesma pasta da DLL).
; Engatar/desengatar e tudo o mais e feito pela tela.
; Modificadores: CTRL, SHIFT, ALT. Teclas: A-Z, 0-9, F1-F24, NUMPAD0-9, MINUS (o "-",
; vale tambem o do teclado numerico), PLUS, LEFT, RIGHT, UP, DOWN, HOME, END, INSERT,
; DELETE, PGUP, PGDN, SPACE, ENTER, TAB
abrir_tela = CTRL+MINUS

[tela]
; jogo    -> o painel abre DENTRO do jogo (atalho acima), sem tirar o jogo de primeiro plano.
;            Precisa do ETS2 em DirectX 11 (o padrao). Se nao der, o plugin usa o app externo.
; externo -> abre o TrailerControl.exe (janela separada), como nas versoes anteriores.
; No painel: Esc fecha; setas escolhem a articulacao; ENTER engata/desengata.
modo = jogo

[som]
; Alarme externo da seta: apita junto com a luz do pisca enquanto houver reboque engatado.
; Liga/desliga e volume tambem pela faixa "Som da seta" na tela. O som sai pelo Windows
; (nao segue o volume do ETS2 e nao e 3D).
alarme_seta = 1
; Volume do alarme, de 0 a 100
volume = 60

[deteccao]
; Palavras (no id, nome ou tipo de carroceria do reboque) que indicam um DOLLY.
; Adicione aqui os nomes usados pelos seus mods.
palavras_dolly = dolly, dolli, converter, dolley

[entrada]
; generic    -> aparece em Opcoes > Controles como "Trailer Control";
;               associe "Engatar / Desengatar reboque" ao botao dele. (recomendado)
; semantical -> aciona direto o controle do jogo cujo nome esta em controle_semantico
modo = generic
controle_semantico = trailer

[memoria]
; EXPERIMENTAL - necessario para dolly / bitrem / articulacoes internas.
; So funciona nas versoes do jogo mapeadas no plugin (hoje: 1.62.3.3). Em qualquer outra
; versao, ou se os bytes do exe nao conferirem, o plugin desliga isto sozinho.
habilitado = 1
; Deixe vazio para aceitar qualquer versao suportada, ou fixe uma (ex.: 1.62.3.3).
versao_jogo =
; Para ENGATAR uma articulacao interna, os engates precisam estar a no maximo esta
; distancia (metros). 0 = nao checar (cuidado: o jogo "puxa" o reboque ate o engate).
distancia_max_engate_m = 1.5
; Convoy (multiplayer oficial da SCS): 1 = desengate interno funciona tambem no comboio.
; Cada jogador ve a propria fisica; os outros podem ver o reboque solto com atraso.
; No TruckersMP o desengate interno fica SEMPRE desligado (risco de banimento).
permitir_convoy = 1
