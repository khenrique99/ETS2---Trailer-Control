; ============================================================
;  ETS2 Trailer Control - configuracao
;  Fica em <ETS2>\bin\win_x64\plugins\trailer_control.ini
; ============================================================

[geral]
; So permite engatar/desengatar com o caminhao (quase) parado
exigir_parado = 1
velocidade_max_kmh = 3

[atalhos]
; Modificadores: CTRL, SHIFT, ALT. Teclas: A-Z, 0-9, F1-F24, NUMPAD0-9,
; LEFT, RIGHT, UP, DOWN, HOME, END, INSERT, DELETE, PGUP, PGDN, SPACE, ENTER, TAB
desengatar_tudo        = CTRL+SHIFT+D      ; solta o conjunto inteiro do cavalo
desengatar_ultimo      = CTRL+SHIFT+U      ; solta a ultima articulacao engatada
desengatar_selecionado = CTRL+SHIFT+X
engatar_selecionado    = CTRL+SHIFT+E
selecionar_proximo     = CTRL+SHIFT+RIGHT
selecionar_anterior    = CTRL+SHIFT+LEFT
listar                 = CTRL+SHIFT+L      ; escreve a composicao no game.log.txt

[deteccao]
; Palavras (no id, nome ou tipo de carroceria do reboque) que indicam um DOLLY.
; Adicione aqui os nomes usados pelos seus mods.
palavras_dolly = dolly, dolli, converter, dolley

[entrada]
; generic    -> aparece em Opcoes > Controles como "Trailer Control";
;               associe "Engatar / Desengatar reboque" ao botao dele. (recomendado)
; semantical -> aciona direto o controle do jogo cujo nome esta em controle_semantico
modo = generic
controle_semantico = trailer

[memoria]
; EXPERIMENTAL - necessario para dolly / bitrem / articulacoes internas.
; Fica desligado ate existirem assinaturas validadas para a versao do jogo.
habilitado = 0
versao_jogo =
assinatura_desengate =
assinatura_engate =
